<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Kshirabdija Sahoo — Portfolio</title>

  <!-- Pixelify Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      background: #e5e5e5;
    }

    /* =========================
       MAIN LAYOUT
    ========================= */

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    /* =========================
       LEFT SIDE
    ========================= */

    .left {
      width: 50%;
      height: 100vh;
      min-height: 700px;
      background: #e5e5e5;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .hello {
      position: relative;
      z-index: 20;

      margin: 10px 0 0 20px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 6vw;
      font-weight: 900;
      line-height: 0.9;

      color: black;
      white-space: nowrap;
    }

    .portfolio-image {
      position: absolute;

      z-index: 10;

      width: 108%;
      max-width: none;

      left: -2%;
      bottom: 0;

      object-fit: contain;
      object-position: bottom left;
    }


    /* =========================
       RIGHT SIDE
    ========================= */

    .right {
      width: 50%;
      height: 100vh;
      min-height: 700px;

      background: #ea63f6;

      position: relative;
      overflow: hidden;
    }

    /* =========================
       DOTS
    ========================= */

    .dots {
      position: absolute;
      inset: 0;

      z-index: 1;

      pointer-events: none;
    }

    .dot {
      position: absolute;

      width: 25px;
      height: 25px;

      background: black;
      border-radius: 50%;
    }

    .dot-1 {
      top: 40px;
      left: 60px;
    }

    .dot-2 {
      top: 40px;
      right: 45px;
    }

    .dot-3 {
      top: 90px;
      right: 125px;
    }

    .dot-4 {
      top: 42%;
      right: 45px;
    }

    .dot-5 {
      bottom: 80px;
      right: 55px;
    }

    .dot-6 {
      bottom: 35px;
      left: 70px;
    }


    /* =========================
       RIGHT CONTENT
    ========================= */

    .content {
      position: relative;

      z-index: 10;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 60px 12%;
    }

    .awkward {
      margin: 0 0 55px 0;

      color: white;

      font-family: "Pixelify Sans", sans-serif;

      font-size: 36px;
      font-weight: 700;

      line-height: 1.25;
    }

    .body-text {
      color: black;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 28px;
      line-height: 1.45;

      max-width: 600px;
    }

    .body-text p {
      margin: 0;
    }

    .body-text p + p {
      margin-top: 55px;
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 35px;

      margin-top: 55px;
    }

    .btn-pixel {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 18px 45px;

      background: #d9d9d9;

      color: black;

      text-decoration: none;

      font-family: "Pixelify Sans", sans-serif;
      font-size: 24px;
      font-weight: 700;

      border: 4px solid black;

      box-shadow: 5px 5px 0 black;

      transition: all 0.15s ease;
    }

    .btn-pixel:hover {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 black;
    }

    .btn-pixel:active {
      transform: translate(5px, 5px);
      box-shadow: none;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 767px) {

      .page {
        flex-direction: column;
      }

      .left {
        width: 100%;
        height: auto;
        min-height: 72vh;

        padding-top: 10px;
      }

      .hello {
        margin-left: 15px;
        margin-top: 10px;

        font-size: 13vw;

        line-height: 0.9;
      }

      .portfolio-image {
        position: relative;

        width: 112%;

        left: -4%;

        bottom: auto;

        margin-top: 35px;
        margin-bottom: -5px;
      }

      .right {
        width: 100%;
        height: auto;
        min-height: 0;

        overflow: hidden;
      }

      .content {
        height: auto;

        justify-content: flex-start;

        padding: 55px 40px 70px;
      }

      .awkward {
        font-size: 30px;

        margin-bottom: 60px;

        line-height: 1.2;
      }

      .body-text {
        font-size: 26px;

        line-height: 1.45;

        max-width: 100%;
      }

      .body-text p + p {
        margin-top: 55px;
      }

      .buttons {
        margin-top: 55px;

        gap: 25px;
      }

      .btn-pixel {
        font-size: 20px;

        padding: 15px 30px;
      }

      /* Keep dots away from text on mobile */
      .dots {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =========================
         LEFT
    ========================== -->

    <section class="left">

      <h1 class="hello">
        print("hello")
      </h1>

      <img
        src="Frame 193.png"
        alt="Kshirabdija Sahoo portfolio"
        class="portfolio-image"
      />

    </section>


    <!-- =========================
         RIGHT
    ========================== -->

    <section class="right">

      <!-- Decorative dots -->
      <div class="dots">

        <div class="dot dot-1"></div>

        <div class="dot dot-2"></div>

        <div class="dot dot-3"></div>

        <div class="dot dot-4"></div>

        <div class="dot dot-5"></div>

        <div class="dot dot-6"></div>

      </div>


      <!-- Content -->
      <div class="content">

        <h2 class="awkward">
          Erm so this is awkward
        </h2>


        <div class="body-text">

          <p>
            This website is currently under construction
            (good things take a second).
          </p>

          <p>
            Until then, here’s a PDF version of my portfolio
            filled with projects, experiments, research,
            and visual explorations.
          </p>

          <p>
            Full website coming soon :)
          </p>

        </div>


        <!-- Buttons -->
        <div class="buttons">

          <a
            href="kshirabdija_portfolio%20%281%29-compressed.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-pixel"
          >
            VIEW
          </a>


          <a
            href="kshirabdija_portfolio%20%281%29-compressed.pdf"
            download
            class="btn-pixel"
          >
            DOWNLOAD
          </a>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
