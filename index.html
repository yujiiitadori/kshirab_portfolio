<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PIXELIFY FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      overflow-x: hidden;
    }

    .btn-pixel {
      border: 4px solid black;
      box-shadow: 4px 4px 0px black;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn-pixel:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px black;
    }
  </style>
</head>

<body class="bg-[#e5e5e5]">

  <div class="w-screen min-h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- LEFT SIDE -->
    <div class="w-full md:w-1/2 bg-[#e5e5e5] relative overflow-hidden flex flex-col items-center min-h-[72vh] md:min-h-screen pt-6 md:pt-4 px-4 md:px-0">
      <h1 class="relative z-30 text-[13vw] md:text-[6vw] font-black leading-none self-start ml-2 md:ml-8 mt-2 md:mt-5">
        print("hello")
      </h1>
      <img src="Frame 193.png" alt="portfolio image" class="relative md:absolute md:bottom-0 md:left-[-2%] z-10 w-[112%] md:w-[100%] max-w-none object-contain mt-6 md:mt-0 mr-2 md:mr-10" />
    </div>

    <!-- RIGHT SIDE -->
    <div class="w-full md:w-1/2 bg-[#ea63f6] relative overflow-hidden min-h-[45vh] md:min-h-screen">
      <div class="relative z-20 h-full flex flex-col justify-center px-8 md:px-20 py-16 md:py-0">
        <h2 class="text-white text-2xl md:text-4xl mb-8 md:mb-12 font-bold" style="font-family: 'Pixelify Sans', sans-serif;">
          Erm so this is awkward
        </h2>
        <div class="text-black text-[1.3rem] md:text-[1.8rem] leading-snug max-w-3xl">
          <p>This website is currently under construction (good things take a second).</p>
          <p class="mt-8 md:mt-12">Until then, here's a PDF version of my portfolio filled with projects, experiments, research, and visual explorations.</p>
          <p class="mt-8 md:mt-12">Full website coming soon :)</p>
        </div>
        <div class="flex flex-wrap gap-6 md:gap-10 mt-10 md:mt-14">
          <button id="viewBtn" class="btn-pixel bg-[#d9d9d9] px-8 md:px-12 py-4 md:py-5 text-black text-lg md:text-2xl font-bold" style="font-family: 'Pixelify Sans', sans-serif;">
            VIEW
          </button>
          <a id="downloadBtn" class="btn-pixel bg-[#d9d9d9] px-8 md:px-12 py-4 md:py-5 text-black text-lg md:text-2xl font-bold inline-flex items-center justify-center" style="font-family: 'Pixelify Sans', sans-serif;">
            DOWNLOAD
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF MODAL - NOW MUCH BIGGER! -->
  <div id="pdfModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-1 md:p-2">
    <div class="bg-white w-full h-full rounded-lg overflow-hidden relative">
      <button id="closeBtn" class="absolute top-3 right-3 bg-black text-white px-5 py-2 z-50 rounded font-bold hover:bg-red-700 transition">✕ CLOSE</button>
      <iframe id="pdfFrame" class="w-full h-full" src=""></iframe>
    </div>
  </div>

  <script>
    // Your PDF file name
    const pdfFile = "kshirabdija_portfolio (1)-compressed.pdf";
    
    // Get full URL to the PDF
    const pdfUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + pdfFile;
    
    // Use Google Docs Viewer - this handles large files!
    const viewerUrl = "https://docs.google.com/viewer?url=" + encodeURIComponent(pdfUrl) + "&embedded=true";
    
    const viewBtn = document.getElementById("viewBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const pdfModal = document.getElementById("pdfModal");
    const closeBtn = document.getElementById("closeBtn");
    const pdfFrame = document.getElementById("pdfFrame");
    
    // Set download link
    downloadBtn.href = pdfFile;
    downloadBtn.setAttribute("download", "");
    
    // View button - use Google Docs viewer
    viewBtn.addEventListener("click", () => {
      pdfFrame.src = viewerUrl;
      pdfModal.classList.remove("hidden");
      document.body.style.overflow = "hidden"; // Prevent scrolling behind modal
    });
    
    // Close modal
    closeBtn.addEventListener("click", () => {
      pdfModal.classList.add("hidden");
      pdfFrame.src = "";
      document.body.style.overflow = "";
    });
    
    // Close on backdrop click
    pdfModal.addEventListener("click", (e) => {
      if (e.target === pdfModal) {
        pdfModal.classList.add("hidden");
        pdfFrame.src = "";
        document.body.style.overflow = "";
      }
    });
  </script>

</body>
</html>
